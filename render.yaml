# Render Blueprint 配置
# 在 Render 网页点 “New +” → “Blueprint” → 连接本仓库 → Apply 即可一键部署
services:
  - type: web
    name: study-sync-backend
    runtime: node
    plan: free                       # 免费档；免费档不活动会休眠，首次访问慢几秒（自动唤醒）
    branch: main                     # 你的 GitHub 默认分支名（也可能是 master）
    buildCommand: ""                 # 无依赖，无需构建
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    # 说明：Render 免费档不允许挂持久磁盘（free tier 不支持 disks），
    # 因此不配 disk，也不设 DATA_DIR，server.js 会自动回退到本地 ./server_data 文件存储。
    # 代价：免费档实例休眠/重启后云端副本可能清空，但本地浏览器进度永不丢，
    # 换设备前在旧设备点一次“同步上传”即可。如需完美持久，升级 Starter 档并加回 disk 块。
