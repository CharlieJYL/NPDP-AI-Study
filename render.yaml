# Render Blueprint 配置
# 在 Render 网页点 “New +” → “Blueprint” → 连接本仓库 → Apply 即可一键部署
services:
  - type: web
    name: study-sync-backend
    runtime: node
    plan: free                      # 免费档（Hobby $0/月）；免费档不允许挂持久磁盘，故不配 disk
    branch: main                    # 你的 GitHub 默认分支名（也可能是 master）
    buildCommand: "echo skip-build" # 无依赖、无构建步骤；用 no-op 显式跳过，避免 Render 默认跑 npm run build 失败
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    # 免费档不支持 disk，故不配 disk/DATA_DIR；server.js 检测不到 /data 时，
    # 会自动回退到程序目录 ./server_data（临时盘，重部署/实例回收会清空，但前端已用
    # “记住凭据+自动登录+进度自愈”规避，详见 index.html）。
