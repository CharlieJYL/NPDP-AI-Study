# Render Blueprint 配置
# 在 Render 网页点 “New +” → “Blueprint” → 连接本仓库 → Apply 即可一键部署
services:
  - type: web
    name: study-sync-backend
    runtime: node
    plan: free                       # 免费档；免费档不活动会休眠，首次访问慢几秒（自动唤醒）
    branch: main                     # 你的 GitHub 默认分支名（也可能是 master）
    buildCommand: ""                 # 无依赖，无需构建
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR                # 进度数据存到这里（持久磁盘挂载点）
        value: /data
    disk:
      name: study-data
      mountPath: /data
      sizeGB: 1                      # 1GB 足够存进度；持久磁盘按用量极廉收费（约 0.15 美元/GB/月），为保证进度不丢建议开启
